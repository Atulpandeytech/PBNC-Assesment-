[project]
name = "pragati-bharti-document-intelligence"
version = "1.0.0"
description = "Production-Grade Document Intelligence & Question Extraction Service for Pragati Bharti"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "arq>=0.25.0",
    "redis>=5.0.3",
    "pymupdf>=1.24.0",
    "opencv-python>=4.9.0",
    "pytesseract>=0.3.10",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "reportlab>=4.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "black>=24.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008", "N805"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
